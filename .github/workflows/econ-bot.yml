name: Alertes economiques Telegram

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: econ-bot-singleton
  cancel-in-progress: true

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Configurer git (pour les commits automatiques)
        run: |
          git config user.name "econ-bot"
          git config user.email "econ-bot@users.noreply.github.com"

      - name: Surveiller le calendrier en continu et repondre aux commandes
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py
