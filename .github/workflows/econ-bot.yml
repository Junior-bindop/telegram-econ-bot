name: Alertes economiques Telegram

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:   # permet de lancer le workflow manuellement pour tester

permissions:
  contents: write   # necessaire pour committer notified_events.json

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Verifier le calendrier et envoyer les alertes
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Sauvegarder l'etat (evenements deja notifies)
        run: |
          git config user.name "econ-bot"
          git config user.email "econ-bot@users.noreply.github.com"
          git add notified_events.json
          git diff --cached --quiet || git commit -m "Update notified events"
          git push
